name: m1-failover-acceptance
topology:
  - id: zk
    contract: registry
    tier: virtual
  - id: master
    contract: scheduler
    tier: real
    sut: true
    launch: { mode: in-process, main: io.duo.sim.examples.scheduler.DemoScheduler }
    config:
      # M1 剧本（计划 §1 v4）：4 条并行长任务（无相互依赖），duration 15s + jitter 0.1
      dag.tasks: "job-a,job-b,job-c,job-d"
    exposes: [{ contract: scheduler, port: 0 }]
    wiring:
      registry: { node: zk, contract: registry }
  - id: workers
    contract: worker
    tier: virtual
    count: 4
    capacity: { slots: 1 }   # §1 v4 钉死：slots=1 使首轮派发后各 feed 耗尽 → 重派发等首批终态
    wiring:
      registry: { node: zk, contract: registry }
behaviors:
  profiles:
    default: { duration: 15s, jitter: 0.1, successRate: 1.0 }
  bindings:
    - node: workers
      profile: default
timeline:
  - at: 10s
    action: crash
    target: workers[3]
  - at: 20s
    action: registry-flap
    target: zk
    duration: 5s
  - at: 27s
    action: restart
    target: workers[3]
assertions:
  - affectedTasksAtLeast: { min: 1 }
  - failoverWithin: { seconds: 30 }
  - noTaskLost: { requireAllSuccess: true }
  - eventSequence: [sim.fault-injected, sut.task-retry]
