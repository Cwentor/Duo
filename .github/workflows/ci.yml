name: CI

# M7 交付物 2（ROADMAP §4）：三个 job —— regression（无 Docker，常规门禁）、
# container（有 Docker，容器档真实往返）、scale（nightly / 手动，压测产物留档）。
# 决策 D8（docs/DECISIONS.md）：CI 在线解析依赖 + setup-java 的 m2 缓存；本地开发维持 -o 离线。
# 原则（T8）：**skip 必须可见、可解释**——每个 job 都打印 skip 汇总，容器档还显式断言「不许 skip」。
# 供应链（安全审计 2026-09-20 L-6）：所有 action pin 到 **commit SHA**，不用可被上游移动的标签；
# 注释里保留人类可读的版本号便于升级（升级＝改 SHA + 改注释，一次提交一件事）。
# 2026-09-26 升级：checkout v4.2.2→v7.0.1 / setup-java v4.7.1→v6.0.1 / upload-artifact v4.6.2→v7.0.1
# （三个新 SHA 均 Node 24 原生，消除「Node 20 action 被 runner 强跑 Node 24」的每轮三条 deprecation 告警）；
# runner 由 ubuntu-latest pin 为 ubuntu-24.04——2026-10-19 起 ubuntu-latest 切 Ubuntu 26（GitHub
# runner-images 公告），本仓有 CI-only 时序红前科（G9、413×2），换代必须显式提交：
# 先 dispatch 本 workflow 验证全绿，再改 pin。

on:
  push:
    # 2026-10-31 审计 P2-1：原 [master, main] 使 dev/review 分支推送零 CI——
    # 门禁退化成「squash 合入 master 后的事后验证」。补 dev/review/feat 三族；
    # concurrency cancel-in-progress 已保证旧推送被新推送顶掉，不烧额度。
    branches: [master, main, dev, 'review/**', 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # nightly 压测（UTC 18:00 = 次日 02:00 CST）
    - cron: '0 18 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: regression (no Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # 缺省 360 分钟挂死面收口（审计 N4）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # M10 计划二：console-ui 前端（Node 仅构建期）。先 build 再 mvnw——
      # maven-resources 缺省不覆盖更新的目标文件，SPA 产物不会被占位页反冲。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - name: console-ui build (SPA into control classpath)
        working-directory: console-ui
        run: |
          npm ci
          npm test
          # 类型门禁（评审 T2，2026-10-30）：vitest 走 esbuild 不做类型检查，首次接入即抓出
          # 6 处真实类型错误（含一处功能性 bug：@click 直传处理器把 PointerEvent 当
          # startScenario 的 replacing 实参，恒真使 409"确认替换"路径不可达）。
          npm run typecheck
          npm run build
      # 无 Docker 档：显式关闭容器档（-Dduo.docker.enabled=false），保证「常规回归零 Docker 依赖」
      # 是**确定**的而不是「恰好这台机器没 Docker」
      - name: mvnw test
        run: ./mvnw -B -Dduo.docker.enabled=false test
      - name: skip summary (must be visible)
        if: always()
        run: bash .github/scripts/skip-summary.sh
      # M7 交付物 4：依赖门禁（`-Dquality` 激活 dependency:analyze-only，failOnWarning=true）。
      # 放在 regression job 里而不是新开 job：复用同一份 ~/.m2 缓存与已下载的插件，
      # 且「本仓依赖声明干净」与「测试全绿」是同一条纪律的两个面。
      # 只到 `verify`（跳过测试）——测试已在上一步跑过。
      - name: dependency gate (no unused/undeclared deps)
        run: ./mvnw -B -Dduo.docker.enabled=false -Dquality -DskipTests verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: regression-surefire-reports
          path: |
            **/target/surefire-reports/*.txt
          if-no-files-found: warn

  container:
    name: container tier (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # 缺省 360 分钟挂死面收口（审计 N4）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: docker info
        run: docker info --format '{{.ServerVersion}}'
      # 容器档真实往返（ZookeeperContainerRegistryTest 4 条 + PostgresContainerStoreTest 6 条，M5 第 4 轮补）
      - name: container tests
        run: >-
          ./mvnw -B -pl duo-sim-embedded -am test
          -Dtest='ZookeeperContainer*,PostgresContainerStoreTest' -Dsurefire.failIfNoSpecifiedTests=false
      # 有 Docker 时容器档**不许 skip**：skip>0 即门禁失败（T8「skip 可解释」）
      - name: assert container tests really ran
        if: always()
        run: bash .github/scripts/skip-summary.sh --fail-on-skip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: warn

  scale:
    name: scale (nightly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # 压测留余量（N4；regression/container 为 45）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 压测产物落 duo-sim-examples/build/scale/*.json（模块工作目录下；.gitignore 覆盖，
      # 故必须作为 artifact 留档 —— G8）。此前路径写的是仓库根的 build/scale/*.json——
      # 测试经 Path.of("build","scale",...) 相对路径写在**模块目录**，根路径永远收不到，
      # if-no-files-found: warn 让它静默空转（2026-09-25 立案：产物上传从未真正落盘过）。
      - name: scale tests
        run: ./mvnw -B -Dduo.scale=true -Dduo.docker.enabled=false test
      - name: skip summary (must be visible)
        if: always()
        run: bash .github/scripts/skip-summary.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scale-artifacts
          path: |
            duo-sim-examples/build/scale/*.json
          if-no-files-found: error

  supply-chain:
    name: supply chain (nightly image scan)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # 缺省 360 分钟挂死面收口（审计 N4）
    # 2026-10-31 审计 P2-2：依赖门禁（-Dquality）只查 unused/undeclared，不查 CVE。
    # 与 image.yml 分工（赘余审查 R2）：nightly 镜像构建+扫描独家在本 job，无双构建。
    # trivy **报告制**：exit-code 0 只出报告，先取 1–2 周基线，
    # 再收严为 HIGH/CRITICAL fail + 忽略清单（收严另立任务，一次提交一件事）。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image
        run: docker build -t duo-sim:nightly .
      - name: trivy scan (HIGH/CRITICAL, report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0（2026-10-31 ls-remote 实取；tag 对象 a9c7b0f 解引用即本 SHA）
        with:
          scan-type: image
          image-ref: duo-sim:nightly
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: summary (must be visible)
        if: always()
        run: |
          if [ -f trivy-report.json ]; then
            echo "HIGH/CRITICAL findings: $(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)"
          else
            echo "::error::trivy-report.json missing — scan did not run"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error
