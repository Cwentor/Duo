# Duo 交互式架构图（architecture-ui，ReactFlow）→ GitHub Pages。
# 与 console-ui 同纪律：构建期独立于 Maven reactor；产物不进仓库，由本 workflow 构建并部署。
# 前置开关（一次性手工）：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: architecture-pages

on:
  push:
    branches: [master]
    paths:
      - 'architecture-ui/**'
      - 'docs/assets/architecture-preview.png'
      - '.github/workflows/architecture-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署（新推送取消在途部署）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: architecture-ui/package-lock.json
      - name: Build architecture-ui（仓库站点子路径 /Duo/）
        run: npm ci && npm run build -- --base=/Duo/
        working-directory: architecture-ui
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: architecture-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
