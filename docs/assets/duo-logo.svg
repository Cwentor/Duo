<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Duo logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- 仿真蓝图网格 -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 32h128M0 64h128M0 96h128M32 0v128M64 0v128M96 0v128"/>
  </g>

  <!-- 虚拟链路（契约连线） -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M30 64h21"/>
    <path d="M64 34v17"/>
    <path d="M64 94V77"/>
    <path d="M77 64h21"/>
  </g>

  <!-- 虚拟组件节点 -->
  <g fill="#FFFFFF" fill-opacity="0.95">
    <circle cx="30" cy="64" r="7"/>
    <circle cx="64" cy="34" r="7"/>
    <circle cx="64" cy="94" r="7"/>
    <circle cx="98" cy="64" r="7"/>
  </g>

  <!-- SUT 观测环（故障注入面） -->
  <circle cx="64" cy="64" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.8"
          stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3.5 5.5"/>

  <!-- SUT：拓扑中唯一的真实实现 -->
  <circle cx="64" cy="64" r="13" fill="url(#sut)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
</svg>
